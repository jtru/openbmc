# include i2c super-i/o driver, but not host-side (lpc) driver
CONFIG_SENSORS_NCT6775_CORE=y
CONFIG_SENSORS_NCT6775_I2C=y
CONFIG_SENSORS_NCT6775=n

CONFIG_SENSORS_SBRMI=y
# https://cateee.net/lkddb/web-lkddb/SENSORS_SBTSI.html
CONFIG_SENSORS_SBTSI=y
CONFIG_SENSORS_LM75=y
CONFIG_SENSORS_NCT7802=y

CONFIG_I2C_MUX_PCA954x=y

# --- /dev/mem stays restricted -----------------------------------------------
# The AMI host-push window (the BIOS drops its SMBIOS tables into reserved DRAM
# at 0x9e000000 and then announces them over NetFn 0x2E) is read through its
# own device node, /dev/aspeed-lpc-ctrl, which the DTS points at that
# carve-out. The only remaining /dev/mem use is the SCU register poke at
# 0x1e6e2000 (endisShareMemory in ami-oem-probe), which is MMIO and so passes
# the strict check unaided.
#
# Clearing this was only ever a diagnostic for "did the BIOS write nowhere, or
# just somewhere /dev/mem refuses to look?" The push now lands and is consumed,
# so the question is answered and the kernel default returns.
CONFIG_STRICT_DEVMEM=y

CONFIG_REALTEK_PHY=y

# For reading DDR4 DIMM SPD/EEPROM data on i2c5
CONFIG_EEPROM_EE1004=y

# For reading DDR4 DIMM TSE2004 temp. sensors
CONFIG_SENSORS_JC42=y

# --- AMI-style USB host interface (bring-up spike; see CLAUDE.md) -----------
# The stock BMC presents the host interface to the BIOS as a standard USB
# ethernet function over the AST virtual hub: RNDIS (0x02/0x02/0xFF) as
# configuration 1 and CDC-ECM (0x02/0x06) as configuration 2, per AMI's
# eth-src/eth_mod.c:CreateEthernetDescriptor. The mainline gadget stack can
# present the same thing, so AMI's usbe/iUSB/usb1_hw drivers do not need to be
# ported. The vhub UDC these attach to already exists (aspeed_vhub).
CONFIG_USB_CONFIGFS_RNDIS=y
CONFIG_USB_CONFIGFS_ECM=y
# HID function: AMI's device is a HID + ethernet composite (interface 0 is HID,
# ethernet at 1 and 2), so we present the same layout.
CONFIG_USB_CONFIGFS_F_HID=y

# The legacy built-in mass-storage gadget driver has no backing file here, so
# it fails to bind on every vhub UDC ("failed to start g_mass_storage: -22" in
# dmesg) and competes with configfs gadgets for those UDCs. jsnbd drives virtual
# media through the configfs f_mass_storage function instead, so the legacy
# driver is dead weight.
# CONFIG_USB_MASS_STORAGE is not set

# vhub/EP0 internals (DDBG/EPVDBG/UDCDBG in aspeed-vhub + accelerated gadget
# debug in the gadget core) are compiled out without this. With it, dmesg shows
# pullup(), every EP0 setup packet, every request queue/completion, and the
# hub port state machine -- the only way to see where enumeration actually
# stalls at the port level, below anything composite/f_rndis can report.
CONFIG_USB_GADGET_DEBUG=y

